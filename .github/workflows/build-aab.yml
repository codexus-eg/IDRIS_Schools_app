name: Build IDRIS Schools AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-aab:
    name: Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDRIS-Schools-1.0.27+27-app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
