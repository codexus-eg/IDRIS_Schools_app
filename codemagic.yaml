workflows:
  idris-schools-ios-testflight-workflow:
    name: IDRIS Schools iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - IDRIS_Schools_Profile
        certificates:
          - ios_cert_manual

    scripts:
      - name: Set iOS deployment target
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Nuke Local Artifacts and Get Dependencies
        script: |
          flutter config --no-enable-swift-package-manager

          # السر هنا: مسح جميع ملفات محرك فلاتر المحلية المرفوعة بالخطأ والتي تسبب المشكلة
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ios/Flutter/ephemeral
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Pods
          rm -f ios/Podfile.lock

          flutter clean
          flutter pub get

          # إجبار CocoaPods على إعادة الربط بملفات السيرفر الجديدة
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
