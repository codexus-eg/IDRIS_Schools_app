workflows:
  idris-schools-ios-testflight-workflow:
    name: IDRIS Schools iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - IDRIS_Schools_Profile
        certificates:
          - ios_cert_manual

    scripts:
      - name: Heal Broken Xcode Project
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

          # تثبيت أداة التعامل مع Xcode
          gem install xcodeproj --no-document

          # السكربت العلاجي لإصلاح الخطأ الذي وقعنا فيه مسبقاً
          cat << 'EOF' > fix_xcode.rb
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.first
          phase = target.frameworks_build_phase
          group = project.main_group.find_subpath('Flutter', false) || project.main_group.new_group('Flutter', 'Flutter')

          # ربط إطار عمل Flutter و App إجبارياً
          ['Flutter.framework', 'App.framework'].each do |fw|
            unless phase.files.any? { |f| f.file_ref && f.file_ref.path == fw }
              ref = group.files.find { |f| f.path == fw } || group.new_reference(fw)
              ref.name = fw
              ref.source_tree = '<group>'
              phase.add_file_reference(ref)
              puts "Healed: Added #{fw} to Frameworks"
            end
          end
          project.save
          EOF
          ruby fix_xcode.rb

      - name: Setup Flutter Engine and Dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
